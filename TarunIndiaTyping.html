<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Tarun India Typing: Practice makes better version of you</title>
	<script src="6d61696e.js"></script>
	<script type="module">
		import * as RemingtonGail from './72656d696e67746f6e2d6761696c.js';
		window.RemingtonGail = RemingtonGail;
	</script>
	<link rel="stylesheet" href="6d61696e.css">
	<link rel="stylesheet" href="front/66726f6e74.css">
	<script src="front/66726f6e74.js"></script>
	
</head>
<body onload="frontPopup()">
	<div id="main">
		<div class="container" id="userWork">
			<div class="textContainer" id="readable">
				<p id="read">Showing Text</p>
			</div>
			<div class="textContainer" id="writable">
			<textarea id="write" inputmode="none" placeholder="start typing..." onbeforeinput="remingtonBeforeInput(event)" oninput="keepWritingBoxFixed(this)" onkeydown="backspacePrevent(event,this.value); remingtonKeydown(event,this)" onkeyup="remingtonKeyup(event,this); typing(this,event)"></textarea>
			</div>
		</div>
		<div class="container" id="userProfile">
			<div id="profileImg"></div>
			<p id="userName">shahshwat</p>
			<div class="pointCase">
				<label>TIMER</label>
				<input type="text" value="00:00" id='timers' disabled>
			</div>
			<div class="pointCase">
				<label>WORDS</label>
				<input id="totalWords" type="text" value="000" disabled>
			</div>
			<button id="restart" onclick="location.reload()">RESTART</button>
			<button class="btn" id="giveup" onclick="frontPopup(true);dashborad(Result);">GIVE UP</button>
		</div>
	</div>
</body>
</html>
